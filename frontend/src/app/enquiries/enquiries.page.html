<ion-header
  [translucent]="true"
  class="ion-no-border border-b border-slate-200 dark:border-slate-800"
>
  <ion-toolbar>
    <ion-title class="px-3 xl:px-4 text-[16px] md:text-[18px]"
      >Enquiries Page</ion-title
    >

    <ion-buttons slot="end">
      <app-notification-bell class="lg:mr-3" />
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="px-2 xl:px-3">
    <ion-searchbar
      clearIcon
      debounce="1300"
      [value]="search()"
      animated
      class="border-2 border-slate-200 dark:border-slate-800 rounded-2xl"
      placeholder="Search Enquiry"
      (ionChange)="setSearchedText($event)"
    />

    <ion-grid>
      <ion-row>
        <ion-col size="12" sizeMd="6">
          <ion-list>
            <ion-item lines="none">
              <ion-select
                multiple="true"
                [value]="filterBy()"
                label="Filter:"
                (ionChange)="setFilters($event)"
                okText="Confirm"
                cancelText="Dismiss"
              >
                <ion-select-option
                  *ngFor="let filter of filters"
                  [value]="filter.value"
                >
                  {{filter.label}}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </ion-list>
        </ion-col>

        <ion-col size="12" sizeMd="6">
          <ion-list>
            <ion-item lines="none">
              <ion-select
                [value]="sortBy()"
                okText="Confirm"
                label="Sort by:"
                cancelText="Dismiss"
                (ionChange)="setSort($event)"
              >
                <ion-select-option
                  *ngFor="let sort of sorts"
                  [value]="sort.value"
                >
                  {{ sort.label}}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </ion-list>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if(!user()) {
  <div
    class="absolute inset-0 z-10 flex min-h-full h-full items-center justify-center bg-white/1 p-4 backdrop-blur-sm dark:bg-dark/50"
  >
    <ion-card
      class="m-0 w-full max-w-md shadow-none border border-slate-200 dark:border-slate-800"
    >
      <ion-card-header class="px-4 pt-5!">
        <ion-card-title>YOU NEED TO SIGN IN TO CONTINUE</ion-card-title>
      </ion-card-header>
      <ion-card-content class="flex! flex-col!">
        <p class="text-slate-500 dark:text-slate-400">
          Please sign in to access enquiries and review messages from potential
          clients.
        </p>

        <ion-button
          (click)="goSignin()"
          class="w-full max-w-75 mx-auto mt-4 md:text-[20px]"
        >
          SIGN IN
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
  }
  <div
    class="min-h-[calc(100vh-300px)] max-w-screen-2xl mx-auto h-full pt-8 xl:pt-12"
  >
    @if (!enquiriesReady() && user()) {
    <ion-progress-bar
      style="margin: 4px 0 0 0"
      type="indeterminate"
    ></ion-progress-bar>
    }

    <app-enquiries-list #enquiriesList></app-enquiries-list>
  </div>

  <app-footer></app-footer>
</ion-content>
