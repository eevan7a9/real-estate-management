<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="px-3 xl:px-4 text-[16px] md:text-[18px]">Properties Page</ion-title>

    <ion-buttons slot="end">
      <app-notification-bell class="lg:mr-3"  />
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="px-2 xl:px-3">
    <ion-searchbar
      inputmode="text"
      clearIcon
      debounce="700"
      animated
      class="border-2 border-slate-200 dark:border-slate-800 rounded-2xl"
      (ionChange)="setSearchedText($event)"
      placeholder="Search Property"
    />

    <ion-grid>
      <ion-row>
        <ion-col size="12" sizeMd="6">
          <ion-list>
            <ion-item lines="none">
              <ion-select
                multiple="true"
                [value]="filterBy()"
                okText="Confirm"
                cancelText="Dismiss"
                label="Filter:"
                (ionChange)="setFilters($event)"
              >
                <ion-select-option
                  *ngFor="let filter of filters"
                  [value]="filter.value"
                >
                  {{filter.label}}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </ion-list>
        </ion-col>

        <ion-col size="12" sizeMd="6">
          <ion-list>
            <ion-item lines="none">
              <ion-select
                [value]="sortBy()"
                okText="Confirm"
                cancelText="Dismiss"
                label="Sort by:"
                (ionChange)="setSort($event)"
              >
                <ion-select-option
                  *ngFor="let sort of sorts"
                  [value]="sort.value"
                >
                  {{ sort.label}}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </ion-list>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-fab
  slot="fixed"
  vertical="bottom"
  horizontal="end"
  class="ion-margin-end show-on-mobile"
>
  <ion-fab-button (click)="presentModal()" color="success">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content>
  <div class="pt-4 2xl:pt-8">
    <ion-progress-bar
      style="margin: 4px 0 0 0"
      type="indeterminate"
      *ngIf="status().isLoading"
    ></ion-progress-bar>

    <ion-card color="danger" *ngIf="status().error">
      <ion-card-content class="flex items-center justify-between gap-3">
        <span>{{ status().error }}</span>
        <ion-button
          fill="clear"
          color="light"
          [disabled]="status().isLoading"
          (click)="loadMoreProperty()"
        >
          Retry
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-grid class="max-w-screen-xl pt-4 mx-auto">
      <ion-row class="ion-align-items-center hide-on-mobile mb-3 lg:mb-5">
        <ion-col class="heading ion-padding-horizontal flex items-center gap-1">
          <span class="mr-3 text-[20px] lg:text-[24px] lg:font-medium">List of Properties</span>

          <!-- Cards Display Options -->
          <ion-button class="ml-2" (click)="displayOption.set(displayType.CardView)" [disabled]="displayOption() === 'cards'" size="small" class="display-option-btn">
            <ion-icon name="grid-outline"></ion-icon>
          </ion-button>
          <!-- List Display Options -->
          <ion-button (click)="displayOption.set(displayType.ListView)" [disabled]="displayOption() === 'list'" size="small" class="display-option-btn">
            <ion-icon name="reorder-four-outline"></ion-icon>
          </ion-button>
        </ion-col>

        <ion-col class="ion-padding-horizontal">
          <ion-button
            color="success"
            class="ion-float-right"
            (click)="presentModal()"
          >
            New Property
            <ion-icon name="add-circle-outline"></ion-icon
          ></ion-button>
        </ion-col>
      </ion-row>
      <!-- Card List of Properties -->
      <app-properties-list
        [displayOption]="displayOption()"
        [properties]="properties()"
        [enableOwnedBadge]="true"
        [hasMore]="status().hasMore"
        (onLoadMore)="loadMoreProperty()"
        [(disableInfinitScroll)]="disableInfinitScroll"
        #propertyLists
      ></app-properties-list>
    </ion-grid>
  </div>
</ion-content>
