<ion-card
  (click)="selectProperty(property())"
  class="shadow-none border border-slate-200 dark:border-slate-800 cursor-pointer"
>
  <ion-card-content>
    <div class="flex gap-x-1">
      <ion-badge
        class="bg-primary h-5 p-1"
        *ngIf="enableOwnedBadge() && user()?.user_id === property()?.user_id"
      >
        Owned
      </ion-badge>
      <app-property-type-badge
        [type]="property()?.type || ''"
      ></app-property-type-badge>
      |
      <ion-badge
        class="h-5 p-1"
        [ngClass]="{
          'bg-success': property()?.transactionType === 'sale',
          'bg-warning': property()?.transactionType === 'rent'
        }"
      >
        For {{ property()?.transactionType }}
      </ion-badge>

      <span
        class="hidden md:block ml-auto mr-0"
        [ngClass]="{ 'mr-9': isOwner() }"
      >
        {{ property()?.createdAt | date }}
      </span>

      <button
        (click)="openPopup($event)"
        class="bg-gray-300 size-7.5 duration-300 ease-in-out transition-colors hover:bg-gray-400 absolute rounded-full! p-2 top-2 right-3 flex justify-center items-center"
        *ngIf="isOwner() && enablePopupOptions()"
        id="popup-trigger-button"
        aria-label="Property actions"
      >
        <ion-icon color="dark" name="ellipsis-vertical-outline"></ion-icon>
      </button>
    </div>

    <div
      class="flex items-center md:items-start text-[14px] lg:mt-2 text-dark dark:text-white"
    >
      <div
        class="text-[16px] lg:text-[18px] text-ellipsis line-clamp-1 min-w-35 md:min-w-75"
      >
        {{ property()?.name }}
      </div>

      <span class="px-2"></span>

      <p
        class="hidden! text-[14px] md:block px-3 border-l border-slate-400 text-slate-600 dark:text-slate-400 font-light flex-1 min-w-0 line-clamp-2!"
      >
        {{ property()?.description }}
      </p>

      <div class="ml-auto mr-0 md:text-[18px] xl:text-[20px] font-light">
        {{ property()?.price | currency: 'PHP' }}
      </div>
    </div>
  </ion-card-content>
</ion-card>
